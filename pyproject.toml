[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recommendation-system"
version = "1.0.0"
description = "Semantic movie recommendations: SBERT embeddings, HNSW search and sentiment-aware ranking"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abhishek Teotia" }]
dependencies = [
    "sentence-transformers>=2.7",
    "hnswlib>=0.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "rapidfuzz>=3.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "requests>=2.32", "pillow>=10"]
llm = ["llama-cpp-python>=0.3", "spacy>=3.7"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools]
packages = ["movie_recommendation_system"]

[tool.ruff]
line-length = 110
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
